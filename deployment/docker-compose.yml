name: ${COMPOSE_PROJECT_NAME:-civichero-local}

services:
  backend:
    build:
      context: ..
      dockerfile: deployment/backend/Dockerfile
    image: ${BACKEND_IMAGE:-civichero-backend:local}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Deployment__AllowHttp: "true"
      ConnectionStrings__DefaultConnection_FILE: /run/secrets/rds_connection
      Jwt__SecretKey_FILE: /run/secrets/jwt_secret
      AWS__Region: ${AWS_REGION:-ap-south-1}
      AWS__BucketName: ${AWS_BUCKET:-civichero-storage}
      AWS__AccessKey_FILE: /run/secrets/aws_access_key
      AWS__SecretKey_FILE: /run/secrets/aws_secret_key
      AI__Provider: ${AI_PROVIDER:-RuleBased}
      AI__ApiKey_FILE: /run/secrets/ai_api_key
      Storage__Provider: S3
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:-http://localhost:5173}
      AllowedHosts: ${ALLOWED_HOSTS:-localhost}
      RELEASE_VERSION: ${RELEASE_VERSION:-phase15-local}
      COMMIT_SHA: ${COMMIT_SHA:-local}
      Redis__Enabled: "true"
      Redis__Configuration: redis:6379,abortConnect=false
      RabbitMq__Enabled: "true"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER:-civichero}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-civichero-local}
      Security__DataProtectionKeysPath: /app/data-protection-keys
    secrets:
      - rds_connection
      - jwt_secret
      - aws_access_key
      - aws_secret_key
      - ai_api_key
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - backend-logs:/app/logs
      - data-protection-keys:/app/data-protection-keys
    networks:
      - civichero
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1G

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - civichero

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-civichero}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-civichero-local}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
    restart: unless-stopped
    networks:
      - civichero

  frontend:
    build:
      context: ..
      dockerfile: deployment/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: ${FRONTEND_IMAGE:-civichero-frontend:local}
    expose:
      - "8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=8m,mode=0755
    networks:
      - civichero
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  reverse-proxy:
    image: nginx:stable-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${PUBLIC_HTTP_PORT:-5173}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=8m,mode=0755
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - civichero
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

networks:
  civichero:
    driver: bridge

volumes:
  backend-logs:
  data-protection-keys:
  redis-data:
  rabbitmq-data:

secrets:
  rds_connection:
    file: ${SECRETS_DIR:-./.secrets}/rds_connection.txt
  jwt_secret:
    file: ${SECRETS_DIR:-./.secrets}/jwt_secret.txt
  aws_access_key:
    file: ${SECRETS_DIR:-./.secrets}/aws_access_key.txt
  aws_secret_key:
    file: ${SECRETS_DIR:-./.secrets}/aws_secret_key.txt
  ai_api_key:
    file: ${SECRETS_DIR:-./.secrets}/ai_api_key.txt
