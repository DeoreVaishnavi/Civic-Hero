name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-build.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-build.yml"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore backend/CivicHero.Backend.Tests/CivicHero.Backend.Tests.csproj
      - name: Build
        run: dotnet build backend/CivicHero.Backend.Tests/CivicHero.Backend.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test backend/CivicHero.Backend.Tests/CivicHero.Backend.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: warn
