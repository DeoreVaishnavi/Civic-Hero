# CivicHero ZAP baseline rules.
# WARN means report but do not immediately fail; FAIL blocks the release.
10010 WARN (Cookie No HttpOnly Flag)
10011 WARN (Cookie Without Secure Flag - development HTTP only)
10015 FAIL (Incomplete or No Cache-control Header Set)
10016 WARN (Web Browser XSS Protection Not Enabled)
10020 FAIL (Missing Anti-clickjacking Header)
10021 FAIL (X-Content-Type-Options Header Missing)
10038 FAIL (Content Security Policy Header Not Set)
10049 WARN (Storable and Cacheable Content)
10202 WARN (Absence of Anti-CSRF Tokens)
40012 FAIL (Cross Site Scripting Reflected)
40018 FAIL (SQL Injection)
90020 FAIL (Remote OS Command Injection)
