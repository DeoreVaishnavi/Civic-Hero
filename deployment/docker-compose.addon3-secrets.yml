# Optional production override for Add-on 3 provider secrets.
# Create the referenced files under deployment/.secrets before using this override.
services:
  backend:
    environment:
      Captcha__Enabled: "true"
      Captcha__Provider: GoogleRecaptcha
      Captcha__ExpectedHostname: ${APP_HOST}
      Captcha__AllowDevelopmentBypass: "false"
      Captcha__SecretKey_FILE: /run/secrets/recaptcha_secret
      Sms__Provider: ${SMS_PROVIDER:-Twilio}
      Sms__AccountSid_FILE: /run/secrets/twilio_account_sid
      Sms__AuthToken_FILE: /run/secrets/twilio_auth_token
      Sms__FromNumber: ${TWILIO_FROM_NUMBER:-}
      Sms__MessagingServiceSid: ${TWILIO_MESSAGING_SERVICE_SID:-}
      VisualVerification__Enabled: "true"
      VisualVerification__Provider: ${VISUAL_VERIFICATION_PROVIDER:-Gemini}
      VisualVerification__ApiKey_FILE: /run/secrets/visual_ai_api_key
      VisualVerification__Model: ${VISUAL_VERIFICATION_MODEL:-gemini-2.5-flash}
    secrets:
      - recaptcha_secret
      - twilio_account_sid
      - twilio_auth_token
      - visual_ai_api_key

  frontend:
    build:
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY}
        VITE_CAPTCHA_DEVELOPMENT_BYPASS: "false"

secrets:
  recaptcha_secret:
    file: ${SECRETS_DIR:-./.secrets}/recaptcha_secret.txt
  twilio_account_sid:
    file: ${SECRETS_DIR:-./.secrets}/twilio_account_sid.txt
  twilio_auth_token:
    file: ${SECRETS_DIR:-./.secrets}/twilio_auth_token.txt
  visual_ai_api_key:
    file: ${SECRETS_DIR:-./.secrets}/visual_ai_api_key.txt
