name: CivicHero Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore backend/CivicHero.Backend.Tests/CivicHero.Backend.Tests.csproj
      - run: dotnet test backend/CivicHero.Backend.Tests/CivicHero.Backend.Tests.csproj --configuration Release --collect:"XPlat Code Coverage" --logger "trx;LogFileName=backend-tests.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/CivicHero.Backend.Tests/TestResults

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/civichero-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/civichero-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/civichero-web/coverage

  browser-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/civichero-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/civichero-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/civichero-web/playwright-report
