<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CivicHero Mid-Term Demo</title>
<style>
:root{--navy:#071a35;--blue:#1769e0;--green:#0f9f6e;--amber:#d88408;--red:#d63f51;--ink:#142033;--muted:#68778c;--line:#e1e7ef;--bg:#f4f7fb;font-family:Inter,Segoe UI,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.shell{min-height:100vh;display:flex}.side{width:244px;background:linear-gradient(#071a35,#07152b);color:#fff;position:fixed;inset:0 auto 0 0;padding:0 12px;display:flex;flex-direction:column}.brand{height:74px;display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid #ffffff18;font-size:22px}.mark{width:38px;height:38px;background:#1769e0;border-radius:12px 12px 12px 3px;display:grid;place-items:center;font-weight:900}.brand b{color:#67a8ff}.side small{font-size:8px;letter-spacing:1.3px;color:#7590b4;margin:18px 10px 6px}.portal{font-size:13px;margin:0 10px 10px}.nav button{border:0;background:transparent;color:#9fb0c7;width:100%;text-align:left;padding:11px;border-radius:8px;margin:2px 0;font-size:12px}.nav button.active,.nav button:hover{background:#1769e040;color:#fff;border-left:3px solid #4b9aff}.roles{margin-top:auto;border-top:1px solid #ffffff18;padding:14px 3px}.roles label{display:block;font-size:8px;color:#7690b2;margin-bottom:7px}.roles select{width:100%;background:#102844;color:#fff;border:1px solid #294160;padding:9px;border-radius:7px}.profile{height:66px;border-top:1px solid #ffffff18;display:flex;align-items:center;gap:9px}.avatar{width:34px;height:34px;border-radius:50%;background:#1769e0;display:grid;place-items:center;font-size:10px;font-weight:800}.profile div{display:flex;flex-direction:column}.profile b{font-size:10px}.profile span{font-size:8px;color:#7890ae}.main{margin-left:244px;flex:1}.top{height:65px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:5}.crumb{font-size:11px;color:#7c8a9d}.online{font-size:9px;background:#edf8f4;color:#0a855c;padding:7px 10px;border-radius:20px}.content{padding:27px;max-width:1500px;margin:auto}.head{display:flex;align-items:end;justify-content:space-between;margin-bottom:23px}.head em{display:block;color:var(--blue);font-size:10px;letter-spacing:1.5px;font-weight:900;font-style:normal}.head h1{font-size:27px;margin:6px 0 4px}.head p{font-size:11px;color:var(--muted);margin:0}.btn{border:0;border-radius:8px;padding:11px 15px;background:var(--blue);color:#fff;font-size:11px;font-weight:800}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:17px}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:12px}.metric{padding:17px;display:flex;gap:12px;align-items:center}.mi{width:42px;height:42px;border-radius:10px;background:#eaf2ff;color:var(--blue);display:grid;place-items:center;font-size:19px}.metric div:last-child{display:flex;flex-direction:column}.metric span{font-size:9px;color:var(--muted)}.metric b{font-size:24px;margin:3px 0}.metric i{font-size:8px;color:var(--green);font-style:normal}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}.grid.equal{grid-template-columns:1fr 1fr}.ph{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.ph h2{font-size:14px;margin:0}.ph p{font-size:8px;color:var(--muted);margin:3px 0}.ph a{font-size:9px;color:var(--blue);font-weight:800}.rows{padding:4px 15px}.row{display:grid;grid-template-columns:45px 1fr auto;gap:11px;align-items:center;padding:12px 2px;border-bottom:1px solid #edf1f5}.thumb{width:43px;height:43px;border-radius:8px;background:linear-gradient(145deg,#718395,#2e4053);color:#fff;display:grid;place-items:center}.copy b{display:block;font-size:10px;margin:4px 0}.copy small{font-size:8px;color:var(--muted)}.badges{display:flex;gap:6px}.status,.priority{font-size:7px;font-weight:900;border-radius:20px;padding:5px 7px}.status{background:#eaf2ff;color:#1769e0}.status.green{background:#e8f8f2;color:#0a895f}.status.amber{background:#fff4dc;color:#ad6900}.priority{background:#ffebe8;color:#bd3a28;border-radius:4px}.end{text-align:right}.end b{font-size:8px;color:#6d7b8f;display:block;margin-top:6px}.donut{width:145px;height:145px;margin:24px auto;border-radius:50%;background:conic-gradient(var(--green) 0 79%,#e8edf3 79%);position:relative;display:grid;place-items:center}.donut:before{content:"";width:104px;height:104px;background:#fff;border-radius:50%;position:absolute}.donut div{position:relative;text-align:center}.donut b{display:block;font-size:26px}.donut span{font-size:8px;color:var(--muted)}.triples{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:0 14px 18px}.triples b{display:block;font-size:14px}.triples span{font-size:8px;color:var(--muted)}.chart{height:245px;padding:25px 20px;display:flex;align-items:end;gap:14px}.bar{flex:1;background:linear-gradient(#5ca1f2,#1769e0);border-radius:5px 5px 2px 2px;position:relative;min-width:12px}.bar small{position:absolute;bottom:-18px;width:100%;text-align:center;color:var(--muted);font-size:7px}.activity{padding:0 17px}.act{display:grid;grid-template-columns:26px 1fr auto;gap:9px;padding:11px 0;border-bottom:1px solid #edf1f5;align-items:start}.act>span{width:25px;height:25px;border-radius:50%;background:#e8f8f2;color:var(--green);display:grid;place-items:center;font-size:9px}.act b{font-size:9px}.act p,.act small{font-size:7px;color:var(--muted);margin:2px 0}.table{width:100%;border-collapse:collapse}.table th{font-size:7px;text-transform:uppercase;letter-spacing:.5px;color:#718095;background:#f8fafc;text-align:left;padding:11px 15px}.table td{font-size:9px;padding:13px 15px;border-top:1px solid #edf1f5}.table strong{font-size:10px}.table small{display:block;color:var(--muted);font-size:7px;margin-top:3px}.map{height:260px;background:#e7edf2;position:relative;overflow:hidden}.road{position:absolute;background:#fff;border:1px solid #d1dae4;z-index:1}.r1{width:130%;height:25px;left:-15%;top:45%;transform:rotate(-8deg)}.r2{height:130%;width:23px;left:60%;top:-15%;transform:rotate(13deg)}.r3{width:95%;height:15px;left:4%;top:73%;transform:rotate(18deg)}.pin{position:absolute;z-index:2;width:28px;height:28px;border-radius:50%;background:var(--red);color:white;display:grid;place-items:center;font-size:9px;font-weight:900;box-shadow:0 4px 10px #0003}.p1{left:20%;top:25%}.p2{left:66%;top:22%;background:var(--green)}.p3{left:75%;top:62%;background:var(--amber)}.p4{left:42%;top:57%;background:var(--blue)}.toast{position:fixed;right:20px;bottom:20px;background:#0a7d59;color:white;padding:13px 17px;border-radius:9px;font-size:10px;display:none;box-shadow:0 10px 30px #0003}.banner{background:#ffebee;border:1px solid #f5c9cf;border-radius:10px;padding:13px 16px;margin-bottom:16px;color:#a72c3d;font-size:10px;display:flex;justify-content:space-between}.hidden{display:none}.tag{font-size:8px;background:#eef2f7;padding:5px 7px;border-radius:5px}.score{display:flex;align-items:center;gap:8px}.progress{width:100px;height:5px;background:#e7ecf2;border-radius:9px}.progress i{height:100%;display:block;background:var(--green);border-radius:9px}@media(max-width:1000px){.metrics{grid-template-columns:repeat(2,1fr)}.grid,.grid.equal{grid-template-columns:1fr}}@media(max-width:720px){.side{transform:translateX(-100%)}.main{margin:0}.content{padding:17px 10px}.metrics{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column;gap:12px}.top{padding:0 12px}.table-wrap{overflow:auto}.table{min-width:680px}}
</style>
</head>
<body>
<div class="shell"><aside class="side"><div class="brand"><span class="mark">✓</span><span><b>Civic</b>Hero</span></div><small>DEMO WORKSPACE</small><div class="portal" id="portalLabel">Citizen Portal</div><nav class="nav" id="nav"></nav><div class="roles"><label>PRESENTATION ROLE</label><select id="role"><option>Citizen</option><option>Officer</option><option>Supervisor</option><option>Admin</option></select></div><div class="profile"><span class="avatar" id="avatar">VP</span><div><b id="name">Vaishnavi Patil</b><span id="dept">Citizen · Ward 12</span></div></div></aside><main class="main"><header class="top"><span class="crumb">CivicHero / <b id="workspace">Citizen workspace</b></span><span class="online">● All systems operational</span></header><div class="content"><section id="dashboard"></section></div></main></div><div class="toast" id="toast">✓ Demo action completed</div>
<script>
const data={
Citizen:{name:'Vaishnavi Patil',avatar:'VP',dept:'Citizen · Ward 12',eyebrow:'CITIZEN DASHBOARD',title:'Good morning, Vaishnavi',text:'Track your civic reports and neighbourhood activity.',button:'+ Report new issue',metrics:[['▤','My complaints','8','2 active right now'],['✓','Issues resolved','6','↑ 2 this month'],['♟','Community support','248','↑ 31 this week'],['★','Civic points','1,280','Gold citizen']],nav:['Dashboard','Report Issue','My Complaints','Nearby Issues','Notifications','Rewards','Profile']},
Officer:{name:'Rahul Deshmukh',avatar:'RD',dept:'Roads · Ward 12',eyebrow:'FIELD OPERATIONS',title:'Officer command centre',text:'Prioritised assignments based on SLA, severity and location.',button:'Open work queue →',metrics:[['▤','Assigned today','14','5 high priority'],['↻','In progress','6','3 teams active'],['✓','Resolved this week','27','↑ 18%'],['◷','SLA compliance','91%','Target 90%']],nav:['Dashboard','Work Queue','Field Map','Notifications','Profile']},
Supervisor:{name:'Meera Kulkarni',avatar:'MK',dept:'Central Zone',eyebrow:'OPERATIONS CONTROL',title:'Supervisor overview',text:'Manage workload, escalations and team performance.',button:'⇄ Auto-assign queue',metrics:[['▤','Open complaints','126','↑ 12 today'],['?','Unassigned','18','5 urgent'],['!','SLA at risk','7','2 critical'],['♟','Teams active','23/27','85% capacity']],nav:['Dashboard','Assignments','Escalations','Performance','Profile']},
Admin:{name:'System Administrator',avatar:'SA',dept:'Platform Administration',eyebrow:'PLATFORM ADMINISTRATION',title:'City operations dashboard',text:'Unified visibility across citizens, teams and services.',button:'↧ Executive report',metrics:[['♟','Registered users','24,836','↑ 8.4%'],['▤','Total complaints','12,480','78.8% resolved'],['▦','Active departments','18','27 teams'],['✓','Platform uptime','99.98%','All healthy']],nav:['Dashboard','User Management','Departments','Analytics','Audit Logs','System Health','Profile']}}
const issues=[['CH-2026-1048','Large pothole near college gate','Roads','In Progress','High','18 hours left'],['CH-2026-1031','Streetlight not working','Electrical','Resolved','Medium','Resolved in 31h'],['CH-2026-1022','Garbage accumulation beside market','Sanitation','Assigned','High','6 hours left'],['CH-2026-1015','Water leakage from main pipeline','Water','Under Review','Critical','2 hours left']];
function statusClass(s){return s==='Resolved'?'green':(s==='Assigned'||s==='Under Review'?'amber':'')}
function metric(m){return `<div class="metric"><span class="mi">${m[0]}</span><div><span>${m[1]}</span><b>${m[2]}</b><i>${m[3]}</i></div></div>`}
function rows(){return issues.map((x,i)=>`<div class="row"><span class="thumb">${['▰','☼','♲','≈'][i]}</span><div class="copy"><div class="badges"><span class="status ${statusClass(x[3])}">${x[3]}</span><span class="priority">${x[4]}</span></div><b>${x[1]}</b><small>${x[0]} · Ward ${[12,12,9,18][i]}</small></div><div class="end"><button class="btn" onclick="act('Opened ${x[0]} details')">View</button><b>${x[5]}</b></div></div>`).join('')}
function chart(){return [48,62,55,72,80,93,86,111,124,116,140,155].map((x,i)=>`<i class="bar" style="height:${x/1.7}px"><small>${['A','S','O','N','D','J','F','M','A','M','J','J'][i]}</small></i>`).join('')}
function activity(){return `<div class="activity">${[['Repair team dispatched','CH-2026-1048 is now in progress'],['Community verification complete','148 citizens supported a road issue'],['Resolution proof uploaded','Streetlight repaired successfully'],['SLA warning','Critical water issue needs assignment']].map(x=>`<div class="act"><span>✓</span><div><b>${x[0]}</b><p>${x[1]}</p></div><small>Today</small></div>`).join('')}</div>`}
function map(){return `<div class="map"><i class="road r1"></i><i class="road r2"></i><i class="road r3"></i><span class="pin p1">!</span><span class="pin p2">✓</span><span class="pin p3">!</span><span class="pin p4">●</span></div>`}
function citizen(d){return `<div class="head"><div><em>${d.eyebrow}</em><h1>${d.title}</h1><p>${d.text}</p></div><button class="btn" onclick="act('Complaint wizard opened — GPS and photo fields ready')">${d.button}</button></div><div class="metrics">${d.metrics.map(metric).join('')}</div><div class="grid"><section class="panel"><div class="ph"><div><h2>My recent complaints</h2><p>Live municipal status</p></div><a>View all →</a></div><div class="rows">${rows()}</div></section><section class="panel"><div class="ph"><div><h2>Ward 12 pulse</h2><p>Last 30 days</p></div></div><div class="donut"><div><b>79%</b><span>resolution rate</span></div></div><div class="triples"><div><b>42</b><span>Reported</span></div><div><b>33</b><span>Resolved</span></div><div><b>4.2h</b><span>Response</span></div></div></section></div><div class="grid equal"><section class="panel"><div class="ph"><div><h2>Nearby issues map</h2><p>Community verified reports</p></div><a>Open map →</a></div>${map()}</section><section class="panel"><div class="ph"><div><h2>Civic activity</h2><p>Recent updates</p></div></div>${activity()}</section></div>`}
function officer(d){return `<div class="head"><div><em>${d.eyebrow}</em><h1>${d.title}</h1><p>${d.text}</p></div><button class="btn" onclick="act('Officer work queue opened')">${d.button}</button></div><div class="banner"><b>! One complaint approaching SLA breach</b><span>Water leakage CH-2026-1015 · 2 hours left</span></div><div class="metrics">${d.metrics.map(metric).join('')}</div><div class="grid"><section class="panel"><div class="ph"><div><h2>Priority work queue</h2><p>Ordered by severity and SLA risk</p></div><a>View all →</a></div><div class="rows">${rows()}</div></section><section class="panel"><div class="ph"><div><h2>Today's field route</h2><p>4 locations · 18.6 km</p></div></div>${map()}</section></div><div class="grid equal"><section class="panel"><div class="ph"><div><h2>Weekly completion</h2><p>Resolved by day</p></div></div><div class="chart">${[5,8,6,9,12,7,10].map((x,i)=>`<i class="bar" style="height:${x*13}px"><small>${'MTWTFSS'[i]}</small></i>`).join('')}</div></section><section class="panel"><div class="ph"><div><h2>Recent field activity</h2><p>Assignment updates</p></div></div>${activity()}</section></div>`}
function supervisor(d){return `<div class="head"><div><em>${d.eyebrow}</em><h1>${d.title}</h1><p>${d.text}</p></div><button class="btn" onclick="act('Smart assignment allocated 5 complaints')">${d.button}</button></div><div class="metrics">${d.metrics.map(metric).join('')}</div><div class="grid"><section class="panel"><div class="ph"><div><h2>Complaint volume trend</h2><p>Submitted vs resolved · 12 months</p></div><a>Download report</a></div><div class="chart">${chart()}</div></section><section class="panel"><div class="ph"><div><h2>SLA health</h2><p>Live department performance</p></div></div><div class="donut"><div><b>86%</b><span>within SLA</span></div></div><div class="triples"><div><b>108</b><span>On track</span></div><div><b>11</b><span>At risk</span></div><div><b>7</b><span>Breached</span></div></div></section></div><section class="panel"><div class="ph"><div><h2>Needs assignment</h2><p>Highest priority unassigned complaints</p></div><a>Manage queue →</a></div><div class="rows">${rows()}</div></section>`}
function admin(d){let us=[['Vaishnavi Patil','Citizen','Ward 12','Active'],['Rahul Deshmukh','Officer','Roads · Ward 12','Active'],['Meera Kulkarni','Supervisor','Central Zone','Active'],['Sneha Joshi','Officer','Electrical · Ward 12','Active']];return `<div class="head"><div><em>${d.eyebrow}</em><h1>${d.title}</h1><p>${d.text}</p></div><button class="btn" onclick="act('Executive report prepared')">${d.button}</button></div><div class="metrics">${d.metrics.map(metric).join('')}</div><div class="grid"><section class="panel"><div class="ph"><div><h2>City complaint trend</h2><p>Monthly volume</p></div><a>Full analytics →</a></div><div class="chart">${chart()}</div></section><section class="panel"><div class="ph"><div><h2>Status distribution</h2><p>All complaints</p></div></div><div class="donut"><div><b>79%</b><span>resolved</span></div></div><div class="triples"><div><b>9,832</b><span>Resolved</span></div><div><b>1,774</b><span>Active</span></div><div><b>874</b><span>Review</span></div></div></section></div><section class="panel"><div class="ph"><div><h2>User governance preview</h2><p>Roles, scopes and status</p></div><a>User management →</a></div><div class="table-wrap"><table class="table"><thead><tr><th>User</th><th>Role</th><th>Scope</th><th>Status</th><th>Action</th></tr></thead><tbody>${us.map(x=>`<tr><td><strong>${x[0]}</strong><small>${x[0].toLowerCase().replaceAll(' ','.')}@civichero.in</small></td><td><span class="tag">${x[1]}</span></td><td>${x[2]}</td><td><span class="status green">${x[3]}</span></td><td><button class="btn" onclick="act('Opened ${x[0]} permissions')">Manage</button></td></tr>`).join('')}</tbody></table></div></section>`}
function render(){let role=document.getElementById('role').value,d=data[role];document.getElementById('portalLabel').textContent=role+' Portal';document.getElementById('workspace').textContent=role+' workspace';document.getElementById('avatar').textContent=d.avatar;document.getElementById('name').textContent=d.name;document.getElementById('dept').textContent=d.dept;document.getElementById('nav').innerHTML=d.nav.map((x,i)=>`<button class="${i===0?'active':''}" onclick="navClick(this,'${x}')">${['⌂','▤','⇄','⌖','◉','↗','●'][i]||'◆'} &nbsp; ${x}</button>`).join('');document.getElementById('dashboard').innerHTML=role==='Citizen'?citizen(d):role==='Officer'?officer(d):role==='Supervisor'?supervisor(d):admin(d)}
function navClick(el,label){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));el.classList.add('active');act(label+' screen selected. Dashboard demo remains visible for presentation continuity.')}function act(text){let t=document.getElementById('toast');t.textContent='✓ '+text;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',2800)}document.getElementById('role').addEventListener('change',render);render();
</script>
</body></html>
