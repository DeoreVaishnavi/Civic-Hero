services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: civichero_testing
      MYSQL_USER: civichero
      MYSQL_PASSWORD: civichero_test
      MYSQL_ROOT_PASSWORD: root_test_only
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_test_only"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis-test:
    image: redis:7-alpine
    ports: ["6380:6379"]

  rabbitmq-test:
    image: rabbitmq:3-management-alpine
    ports: ["5673:5672", "15673:15672"]

  minio-test:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: civichero_test
      MINIO_ROOT_PASSWORD: civichero_test_secret
    ports: ["9002:9000", "9003:9001"]

  mailhog-test:
    image: mailhog/mailhog:latest
    ports: ["1026:1025", "8026:8025"]
